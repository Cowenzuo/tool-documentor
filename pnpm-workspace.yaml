# 本工程所有模块平级放在 packages/ 下：
#   core / templates / docx / postprocess 是纯逻辑库，desktop 是可执行程序（Electron 壳含界面）。
# 不再使用 apps/ 分组——可执行与库只是角色不同，同属一个工程，没必要分两处放。
packages:
  - 'packages/*'

allowBuilds:
  electron: true
  # Squirrel.Windows 目标不用（我们走 NSIS）；显式拒绝以通过 pnpm 构建白名单校验
  electron-winstaller: false
  esbuild: true
